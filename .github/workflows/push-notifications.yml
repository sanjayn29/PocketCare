name: Scheduled Push Notifications

on:
  schedule:
    - cron: "5 18 * * *" # 11:35 PM IST daily
    # use "58 17 * * *" for 11:28 PM IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Which notification mode to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - goals

jobs:
  send_notifications:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate secrets
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          [ -n "$FIREBASE_PROJECT_ID" ] || (echo "Missing FIREBASE_PROJECT_ID" && exit 1)

      - name: Install firebase-admin
        run: npm i firebase-admin

      - name: Send notifications
        run: node scripts/send-cron-notifications.js "$MODE"
