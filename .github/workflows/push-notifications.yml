name: Scheduled Push Notifications

on:
  schedule:
    # 7:00 PM IST = 13:30 UTC — daily progress check-in
    - cron: "30 13 * * *"
    # 8:00 AM IST = 02:30 UTC — morning deadline reminders (tasks, goals, placements, debts)
    - cron: "30 2 * * *"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Which notification mode to run"
        required: true
        default: "deadlines"
        type: choice
        options:
          - daily
          - deadlines
          - goals
          - tasks
          - placements
          - debts
          - all

jobs:
  send_notifications:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine notification mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
            MODE="deadlines"
          else
            MODE="daily"
          fi
          echo "MODE=$MODE"
          echo "value=$MODE" >> $GITHUB_OUTPUT

      - name: Validate secrets
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || (echo "❌ Missing FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          [ -n "$FIREBASE_PROJECT_ID" ]           || (echo "❌ Missing FIREBASE_PROJECT_ID" && exit 1)
          echo "✅ Secrets validated. MODE=${{ steps.mode.outputs.value }}"

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Send notifications
        run: node scripts/send-cron-notifications.js "${{ steps.mode.outputs.value }}"

