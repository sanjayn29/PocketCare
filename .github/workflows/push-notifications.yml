name: Scheduled Push Notifications

on:
  schedule:
    - cron: "30 13 * * *" # 7:00 PM IST daily-checkin (GitHub cron uses UTC)
    - cron: "30 2 * * *" # 8:00 AM IST task + goal deadline reminders (GitHub cron uses UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "Which notification mode to run"
        required: true
        default: "deadlines"
        type: choice
        options:
          - deadlines
          - all
          - daily
          - goals
          - tasks

jobs:
  send_notifications:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '30 2 * * *' && 'deadlines' || 'daily') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate secrets
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          [ -n "$FIREBASE_PROJECT_ID" ] || (echo "Missing FIREBASE_PROJECT_ID" && exit 1)

      - name: Install firebase-admin
        run: npm i firebase-admin

      - name: Send notifications
        run: node scripts/send-cron-notifications.js "$MODE"
