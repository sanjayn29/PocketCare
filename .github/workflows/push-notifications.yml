name: Scheduled Push Notifications

on:
  schedule:
    - cron: "9 17 * * *"   # 10:39 PM IST (daily check-in)
    - cron: "15 17 * * *"  # 10:45 PM IST (goal deadline)
  workflow_dispatch:
    inputs:
      run_daily:
        description: "Run daily check-in job"
        required: false
        default: "true"
      run_goals:
        description: "Run goal deadline job"
        required: false
        default: "true"

jobs:
  daily_checkin:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '9 17 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_daily == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i firebase-admin
      - run: node scripts/send-cron-notifications.js daily
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}

  goal_deadline:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 17 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run_goals == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i firebase-admin
      - run: node scripts/send-cron-notifications.js goals
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
